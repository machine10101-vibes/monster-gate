name: Integrate World 1 into main

on:
  push:
    branches:
      - integrate/world1-into-main

permissions:
  contents: write

concurrency:
  group: integrate-world1-into-main
  cancel-in-progress: false

jobs:
  merge-and-verify:
    if: "!contains(github.event.head_commit.message, 'Verified World 1 PvP integration')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge World 1 history while preserving current main on conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MAIN_HEAD=$(git rev-parse HEAD)
          git fetch origin mg-servers/world-1-live
          git merge --no-edit -X ours -m "Integrate World 1 server branch into main" FETCH_HEAD
          git checkout "$MAIN_HEAD" -- src/ tests/ server/auth.js server/index.js server/social.js server/social-store.js server/social-world.js server/store.js
      - name: Wire the Colosseum server into the current World 1 server
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, needle, replacement):
              p = Path(path)
              s = p.read_text()
              if replacement in s:
                  return
              if needle not in s:
                  raise SystemExit(f"Could not find expected insertion point in {path}: {needle[:90]!r}")
              p.write_text(s.replace(needle, replacement, 1))

          world = Path("server/world.js")
          s = world.read_text()
          marker = "import { createCombatLoot } from './combat-loot.js';"
          if "import { createPvpRuntime } from './pvp.js';" not in s:
              if marker not in s:
                  raise SystemExit("Could not find combat-loot import")
              s = s.replace(marker, marker + "\nimport { createPvpRuntime } from './pvp.js';", 1)
          anchor = "    });\n  }\n\n  async idle()"
          if "this.pvp = opts.pvp || createPvpRuntime(this);" not in s:
              if anchor not in s:
                  raise SystemExit("Could not find World constructor end")
              s = s.replace(anchor, "    });\n    this.pvp = opts.pvp || createPvpRuntime(this);\n  }\n\n  async idle()", 1)
          world.write_text(s)

          dispatch = "      else if (msg.type === 'rift_enter') this.enterRift(session).catch((err) => this.actionError(session, err));"
          pvp_dispatch = """      else if (msg.type === 'pvp_queue') this.pvp.enqueue(session, String(msg.mode || '1v1'));
                else if (msg.type === 'pvp_confirm') this.pvp.confirm(session, msg.proposal_id, msg.accept === true);
                else if (msg.type === 'pvp_cancel') this.pvp.cancel(session);
                else if (msg.type === 'pvp_attack') this.pvp.attack(session, msg.target_id);
                else if (msg.type === 'pvp_roll') this.pvp.roll(session);
                else if (msg.type === 'pvp_leave') this.pvp.leave(session);
          """ + dispatch
          replace_once("server/world.js", dispatch, pvp_dispatch)
          replace_once("server/world.js", "      this.social.onLeave(session);", "      this.social.onLeave(session);\n      this.pvp?.disconnect?.(session);")

          protocol = Path("server/protocol.js")
          s = protocol.read_text()
          s = s.replace("    hp: p.hp,\n    ...extra,", "    hp: p.hp,\n    pvp_team: p.pvpTeam ?? null,\n    pvp_dead: !!p.pvpDead,\n    ...extra,")
          s = s.replace("    hp: p.hp,\n  };\n}\n\nconst POSE_KEYS", "    hp: p.hp,\n    pvp_team: p.pvpTeam ?? null,\n    pvp_dead: !!p.pvpDead,\n  };\n}\n\nconst POSE_KEYS")
          s = s.replace("'zone', 'hp'];", "'zone', 'hp', 'pvp_team', 'pvp_dead'];")
          needle = "export function inAoi(observer, other, radius = AOI_RADIUS) {\n  if (!observer || !other) return false;"
          arena = """export function inAoi(observer, other, radius = AOI_RADIUS) {
            if (!observer || !other) return false;
            const arenaA = String(observer.zone || '').startsWith('colosseum:');
            const arenaB = String(other.zone || '').startsWith('colosseum:');
            if (arenaA || arenaB) {
              if (!arenaA || !arenaB || observer.zone !== other.zone) return false;
            }"""
          if "const arenaA = String(observer.zone" not in s:
              if needle not in s:
                  raise SystemExit("Could not find inAoi insertion point")
              s = s.replace(needle, arena, 1)
          protocol.write_text(s)

          helpers = Path("server/tests/lib/helpers.js")
          h = helpers.read_text()
          if "  dan:" not in h:
              h = h.replace("  cal: { userId: CAL, name: 'Cal' },", "  cal: { userId: CAL, name: 'Cal' },\n  dan: { userId: '44444444-4444-4444-8444-444444444444', name: 'Dan' },")
          if "  eve:" not in h:
              h = h.replace("  dan: { userId: '44444444-4444-4444-8444-444444444444', name: 'Dan' },", "  dan: { userId: '44444444-4444-4444-8444-444444444444', name: 'Dan' },\n  eve: { userId: '55555555-5555-4555-8555-555555555555', name: 'Eve' },")
          if "  fox:" not in h:
              h = h.replace("  eve: { userId: '55555555-5555-4555-8555-555555555555', name: 'Eve' },", "  eve: { userId: '55555555-5555-4555-8555-555555555555', name: 'Eve' },\n  fox: { userId: '66666666-6666-4666-8666-666666666666', name: 'Fox' },")
          helpers.write_text(h)
          PY
          git add server/world.js server/protocol.js
          git commit -m "Verified World 1 PvP integration"
      - name: Install game dependencies
        run: npm ci
      - name: Install persistence dependencies
        run: npm ci --prefix server/persistence
      - name: Run client and server tests
        timeout-minutes: 15
        run: node --test --test-force-exit tests/*.js server/tests/*.test.js
      - name: Run persistence tests
        timeout-minutes: 15
        run: npm run test --prefix server/persistence -- --test-force-exit
      - name: Build production client
        run: npm run build
      - name: Push verified integration branch
        run: git push origin HEAD:integrate/world1-into-main
