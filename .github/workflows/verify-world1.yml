name: World 1 production verification

on:
  pull_request:
    branches: [mg-servers/world-1-live]
  push:
    branches: [mg-servers/world-1-live]

permissions:
  contents: read

concurrency:
  group: world1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Install persistence dependencies
        run: npm ci --prefix server/persistence
      - name: Run client and live server tests
        timeout-minutes: 10
        run: node --test --test-force-exit tests/*.js server/tests/*.test.js
      - name: Run persistence tests
        timeout-minutes: 10
        run: npm run test --prefix server/persistence -- --test-force-exit
      - name: Build production client
        run: npm run build
