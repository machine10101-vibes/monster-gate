name: guild-link

on:
  push:
    paths:
      - .github/workflows/guild-link.yml

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Collect the public project link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url_re = re.compile(r"https://[a-z0-9-]+\.supabase\.co\Z", re.I)

          def clean_url(value):
              value = (value or "").strip().rstrip("/")
              return value if url_re.match(value) else ""

          def anon_from_token(token):
              req = urllib.request.Request(
                  "https://api.supabase.com/v1/projects",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  projects = json.load(res)
              if not isinstance(projects, list) or not projects:
                  return "", ""
              ranked = sorted(projects, key=lambda p: (0 if "monster" in str(p.get("name", "")).lower() else 1, p.get("name") or ""))
              ref = str(ranked[0].get("id") or "")
              if not ref:
                  return "", ""
              key_req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{ref}/api-keys",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(key_req, timeout=30) as res:
                  keys = json.load(res)
              anon = ""
              for item in keys if isinstance(keys, list) else []:
                  name = str(item.get("name") or item.get("type") or "").lower()
                  if name in {"anon", "publishable"}:
                      anon = str(item.get("api_key") or item.get("key") or "")
                      break
              return f"https://{ref}.supabase.co", anon

          url = clean_url(os.environ.get("SUPABASE_URL") or os.environ.get("VITE_SUPABASE_URL"))
          key = (os.environ.get("SUPABASE_ANON_KEY") or os.environ.get("VITE_SUPABASE_ANON_KEY") or "").strip()
          token = (os.environ.get("SUPABASE_ACCESS_TOKEN") or "").strip()
          if (not url or not key) and token:
              try:
                  found_url, found_key = anon_from_token(token)
              except Exception:
                  found_url, found_key = "", ""
                  print("token-rejected")
              url = url or clean_url(found_url)
              key = key or found_key
          path = "guild-link.json"
          if url and key and len(key) >= 20:
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump({"url": url, "key": key}, fh)
              print("linked")
          else:
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump({"status": "missing"}, fh)
              print("missing")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guild-link
          path: guild-link.json
          if-no-files-found: error
