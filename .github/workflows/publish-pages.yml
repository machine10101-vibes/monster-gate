name: Build and publish GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: monster-gate-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production site
        run: env -u VITE_BASE npm run build
        env:
          MG_WORLD_URL: wss://monster-gate-world-1.onrender.com
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Publish dist to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          publish_dir="$RUNNER_TEMP/monster-gate-gh-pages"
          git worktree add "$publish_dir" origin/gh-pages

          # Replace generated site files only; keep the custom-domain and Jekyll markers.
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME ! -name .nojekyll -exec rm -rf {} +
          cp -a dist/. "$publish_dir"/

          test -f "$publish_dir/CNAME"
          test "$(tr -d '\r\n' < "$publish_dir/CNAME")" = "monstergate.online"
          test -f "$publish_dir/.nojekyll"

          git -C "$publish_dir" add -A
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish Monster Gate ${{ github.sha }}"
            git -C "$publish_dir" push origin HEAD:gh-pages
          else
            echo "Built site is already current; no gh-pages update needed."
          fi
