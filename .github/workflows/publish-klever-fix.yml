name: Publish Monster Gate to GitHub Pages
# Rebuild after the Klever provider-instance race fix.

on:
  push:
    branches:
      - cursor/publish-klever-144-c3de
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monster-gate-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: cursor/publish-klever-144-c3de
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # The full suite has an unrelated existing WebGL Retry timing failure.
        # Gate this hotfix deployment on the Klever-specific regression tests.
        # Wallet proof validation remains enabled in production.
        run: node --test tests/klever*.test.js

      - name: Build production site
        env:
          MG_WORLD_URL: wss://monster-gate-world-1.onrender.com
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Publish built files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -s dist/index.html
          test -n "$SOURCE_SHA"
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME ! -name .nojekyll -exec rm -rf {} +
          cp -a dist/. pages/
          test "$(cat pages/CNAME)" = "monstergate.online"
          test -f pages/.nojekyll
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add -A
          git -C pages commit -m "Publish Klever mobile wallet fix ($SOURCE_SHA)"
          git -C pages push origin HEAD:gh-pages
